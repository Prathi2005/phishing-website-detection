<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI-Based Phishing Website Detection</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <div class="bg-glow glow1"></div>
    <div class="bg-glow glow2"></div>

    <div class="container">

        <div class="dashboard">

            <div class="shield">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <h1>
    
                <span class="title-main">
                    Phishing Website Detection System
                </span><br>

            </h1>

            <p class="subtitle">
                Detect whether a website URL is legitimate or phishing using Machine Learning
            </p>

            <div class="input-section">

                <input
                    type="text"
                    id="urlInput"
                    placeholder="Enter Website URL">

                <button onclick="scanURL()">

                <i class="fa-solid fa-magnifying-glass"></i>

                Scan Website

                </button>

            </div>

            <div class="scan-bar" id="scanBar">

            <div class="scan-line"></div>

            </div>

            <div class="result-card">

                <h2 id="scoreText">
                    Detection Confidence: 0%
                </h2>

                <div class="meter">

                    <div
                        class="meter-fill"
                        id="meterFill">
                    </div>

                </div>

                

                <div id="result">

                </div>

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
